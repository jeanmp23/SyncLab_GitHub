<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyncLab | Simulador de sincronización</title><style>
:root{font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;color:#e8eefb;background:#090e1c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0%,#1a2d52 0,transparent 35%),#090e1c}.shell{max-width:1450px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.brand{font-size:25px;font-weight:850;letter-spacing:-1px}.brand span{color:#57d5e8}.tag{font-size:12px;color:#a4b6d4;background:#17243b;padding:9px 12px;border-radius:99px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px}.side,.panel{background:#111b30;border:1px solid #263754;border-radius:18px;padding:17px}.side{align-self:start;position:sticky;top:12px}.side small{color:#7f94b4;letter-spacing:2px}.nav{width:100%;display:flex;align-items:center;gap:10px;border:1px solid transparent;color:#aabbd6;background:transparent;border-radius:11px;padding:12px;margin-top:6px;text-align:left;cursor:pointer}.nav:hover{background:#1a2a46}.nav.sel{background:#193955;border-color:#357f9c;color:#e6fcff}.main{min-width:0;display:grid;gap:15px}.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}.head h1{font-size:24px;margin:0 0 4px}.sub{color:#8fa4c3;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{font:inherit;cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.btn{padding:10px 15px;border-radius:10px;border:1px solid #365174;background:#1a2b45;color:#e6eefb;font-weight:650}.btn.primary{background:#35c8d8;color:#071725;border-color:#35c8d8}.btn.danger{border-color:#a05a69;color:#ffbdc5}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{background:#111b30;border:1px solid #263754;border-radius:14px;padding:16px}.stat .k{color:#91a5c3;font-size:12px}.stat .v{font-size:26px;font-weight:800;margin-top:6px}.stage{min-height:330px}.stagehead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}.stagehead h2{font-size:16px;margin:0}.chip{font-size:12px;border-radius:99px;padding:6px 10px;background:#243a55;color:#a9dded}.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.lane{border:1px solid #2e4260;background:#10192b;border-radius:14px;padding:16px}.lane h3{margin:0 0 12px;font-size:15px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;background:#39d1de}.lane:nth-child(2) .dot{background:#f7ae68}.instr{min-height:75px;border-radius:12px;background:#1a2b45;padding:16px;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;text-align:center}.lane .tiny{color:#94a9c7;font-size:12px;margin-top:10px}.memory{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:22px 8px}.cell{width:100px;min-height:95px;background:#1b2b46;border:1px solid #3b587c;border-radius:14px;display:flex;flex-direction:column;justify-content:center;align-items:center}.cell .n{font-size:33px;font-weight:850}.cell small{font-size:11px;color:#9bb0cf}.cell.hot{background:#164c59;border-color:#3ad0de}.cell.warn{background:#53333e;border-color:#e68a8a}.flow{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.arrow{color:#7892b9;font-size:24px}.foot{display:grid;grid-template-columns:1fr 1fr;gap:15px}.log{height:205px;overflow:auto;font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.7}.entry{padding:5px 0;border-bottom:1px solid #24334c;color:#b6c9e4}.entry b{color:#63d9e4}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls label{color:#b4c5dd;font-size:12px;display:flex;gap:6px;align-items:center}.controls select,.controls input{border-radius:8px;border:1px solid #415b7d;background:#101b2e;color:white;padding:9px;max-width:120px}.progress{height:7px;background:#24344e;border-radius:99px;overflow:hidden;margin-top:14px}.bar{height:100%;background:linear-gradient(90deg,#2cc3d7,#8a8eff);transition:width .25s}.muted{color:#90a6c5}.note{font-size:12px;color:#7f95b6;margin-top:6px}.highlight{color:#50d8e4}.warning{color:#f8b878}.good{color:#77e5ae}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;flex-wrap:wrap;gap:4px}.side small{width:100%}.nav{width:auto;margin:0}.stats{grid-template-columns:repeat(2,1fr)}.foot{grid-template-columns:1fr}}@media(max-width:520px){.shell{padding:12px}.lanes{grid-template-columns:1fr}.brand{font-size:20px}.stat .v{font-size:22px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">◈ Sync<span>Lab</span> <span style="font-size:13px;color:#7f94b4;font-weight:500">/ simulador</span></div><span class="tag">● Laboratorio local · Sin conexión</span></header><div class="layout"><aside class="side"><small>SIMULACIONES</small><div id="nav"></div></aside><main class="main"><section class="panel"><div class="head"><div><h1 id="title"></h1><div class="sub" id="subtitle"></div></div><div class="actions"><button class="btn" id="reset">↺ Reiniciar</button><button class="btn" id="step">Siguiente paso →</button><button class="btn primary" id="play">▶ Ejecutar</button></div></div><div class="progress"><div class="bar" id="bar" style="width:0"></div></div></section><div class="stats" id="stats"></div><section class="panel stage"><div class="stagehead"><h2>Visualización en tiempo real</h2><span class="chip" id="state">Preparado</span></div><div id="visual"></div></section><div class="foot"><section class="panel"><div class="stagehead"><h2>Panel de control</h2></div><div class="controls" id="controls"></div><div class="note" id="hint"></div></section><section class="panel"><div class="stagehead"><h2>Consola de eventos</h2><button class="btn" id="clear" style="padding:6px 10px;font-size:12px">Limpiar</button></div><div class="log" id="log"></div></section></div></main></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const tabs=[['race','⚡','Condición de carrera'],['mutex','🔒','Mutex'],['atomic','⚙','Operaciones atómicas'],['sem','🚦','Semáforos'],['producer','📦','Productor / consumidor'],['condition','🔔','Variable de condición'],['spin','🔄','Spinlock'],['vector','🧩','Vector compartido']];let current='race',idx=0,events=[],timer=null,model={};const race=[['A','Lee count',5,'A lee count = 5'],['A','Calcula +1',5,'A prepara el valor 6'],['B','Lee count',5,'B también lee count = 5'],['B','Calcula −1',5,'B prepara el valor 4'],['A','Escribe 6',6,'A escribe 6'],['B','Escribe 4',4,'B sobrescribe 4: actualización perdida']];const mutex=[['A','Adquiere mutex',5,'A obtiene el mutex'],['B','Espera mutex',5,'B bloqueado: mutex ocupado'],['A','Lee y suma',5,'A lee 5 y calcula 6'],['A','Escribe 6',6,'A escribe 6'],['A','Libera mutex',6,'A libera el mutex'],['B','Adquiere mutex',6,'B entra a la sección crítica'],['B','Lee y resta',6,'B lee 6 y calcula 5'],['B','Escribe 5',5,'B escribe 5'],['B','Libera mutex',5,'B libera el mutex']];const atomic=[['A','fetch_add(1)',6,'A incrementa atómicamente de 5 a 6'],['B','fetch_sub(1)',5,'B decrementa atómicamente de 6 a 5']];const sequence={race,mutex,atomic};function log(msg){events.push(msg);$('log').innerHTML=events.map((x,i)=>`<div class="entry"><b>${String(i+1).padStart(2,'0')}</b> ${x}</div>`).join('');$('log').scrollTop=$('log').scrollHeight}function card(k,v){return `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`}function cell(n,label,cls=''){return `<div class="cell ${cls}"><span class="n">${n}</span><small>${label}</small></div>`}function controls(...buttons){$('controls').innerHTML='';buttons.forEach(([label,cb,primary])=>{const b=document.createElement('button');b.className='btn'+(primary?' primary':'');b.textContent=label;b.onclick=cb;$('controls').append(b)})}function refresh(){const label=tabs.find(x=>x[0]===current);$('title').textContent=label[2];$('subtitle').textContent=({race:'Dos hilos comparten un contador sin protección',mutex:'Acceso exclusivo a una sección crítica',atomic:'Operaciones indivisibles sobre memoria compartida',sem:'Dos permisos para acceder a recursos limitados',producer:'Búfer limitado con capacidad de tres elementos',condition:'Esperar y notificar un cambio de estado',spin:'Bloqueo con comprobación repetida',vector:'Acceso concurrente a una estructura dinámica'})[current];$('step').disabled=!sequence[current];$('play').disabled=!sequence[current];$('hint').textContent=sequence[current]?'Avanza instrucción por instrucción o ejecuta la secuencia completa.':'Utiliza los botones para cambiar el estado de la simulación.';if(sequence[current])drawSequence();else drawInteractive()}
function drawSequence(){const seq=sequence[current],s=seq[idx-1],value=s?s[2]:5;$('stats').innerHTML=card('Contador compartido',value)+card('Valor esperado','5')+card('Operaciones',`${idx} / ${seq.length}`)+card('Resultado',idx===seq.length?(value===5?'<span class="good">Correcto</span>':'<span class="warning">Error</span>'):'En curso');$('state').textContent=idx===seq.length?'Finalizado':idx===0?'Preparado':'Ejecutando';$('bar').style.width=(idx/seq.length*100)+'%';const last=s?s[0]:null;$('visual').innerHTML=`<div class="lanes"><div class="lane"><h3><span class="dot"></span>Hilo A · incremento</h3><div class="instr">${s&&last==='A'?s[1]:'Esperando / listo'}</div><div class="tiny">${seq.filter((x,i)=>x[0]==='A'&&i<idx).length} instrucciones ejecutadas</div></div><div class="lane"><h3><span class="dot"></span>Hilo B · decremento</h3><div class="instr">${s&&last==='B'?s[1]:'Esperando / listo'}</div><div class="tiny">${seq.filter((x,i)=>x[0]==='B'&&i<idx).length} instrucciones ejecutadas</div></div></div><div class="memory">${cell(value,'count',idx===seq.length&&value!==5?'warn':'hot')}${cell(5,'valor correcto')}</div><div class="sub" style="text-align:center">${s?s[3]:'Presiona «Siguiente paso» para comenzar'}</div>`;controls(['Reproducir paso',next,true],['Ejecutar todo',all],['Reiniciar',reset])}
function next(){if(!sequence[current])return;const s=sequence[current][idx];if(!s)return;idx++;log(s[3]);refresh()}function all(){if(!sequence[current])return;stop();timer=setInterval(()=>{if(idx>=sequence[current].length){stop();return}next()},450)}function stop(){if(timer){clearInterval(timer);timer=null}}function reset(){stop();idx=0;events=[];model={permits:2,active:0,queue:0,buffer:[],serial:1,ready:false,lock:null,spins:0,vector:[],conflict:false};$('log').innerHTML='<div class="entry">Simulación lista para comenzar.</div>';refresh()}function action(type){const m=model;switch(current){case'sem':if(type==='acquire'){if(m.permits){m.permits--;m.active++;log('Permiso adquirido. En uso: '+m.active)}else{m.queue++;log('Sin permisos: solicitud en cola')}}else if(type==='release'){if(m.queue&&m.active){m.queue--;log('Un permiso liberado se entrega a un hilo en espera')}else if(m.active){m.active--;m.permits++;log('Permiso devuelto')}else log('No hay permisos adquiridos para liberar')}break;case'producer':if(type==='add'){if(m.buffer.length===3)log('Productor espera: búfer lleno');else{m.buffer.push(m.serial++);log('Productor añadió un elemento')}}else if(m.buffer.length){log('Consumidor retiró '+m.buffer.shift())}else log('Consumidor espera: búfer vacío');break;case'condition':if(type==='wait')log(m.ready?'Condición verdadera: consumidor puede continuar':'Consumidor espera y libera temporalmente el mutex');else if(type==='signal'){m.ready=true;log('Productor añade dato y envía señal')}else if(m.ready){m.ready=false;log('Consumidor verifica condición y retira dato')}else log('Sin dato: consumidor debe esperar');break;case'spin':if(type==='a'||type==='b'){const who=type.toUpperCase();if(!m.lock){m.lock=who;log(who+' adquiere el spinlock')}else{m.spins++;log(who+' intenta adquirir: espera activa (intento '+m.spins+')')}}else if(m.lock){log(m.lock+' libera el bloqueo');m.lock=null}else log('El bloqueo ya está libre');break;case'vector':if(type==='a'){m.vector.push('A'+(m.vector.length+1));log('Hilo A inserta un elemento en vector')}else if(type==='b'){if(m.vector.length)log('Hilo B extrae '+m.vector.pop());else log('Hilo B intenta extraer: vector vacío')}else{m.conflict=true;log('Intercalación insegura simulada: dos hilos leen el mismo tamaño y preparan una escritura en el mismo índice')}}refresh()}
function drawInteractive(){const m=model;let stats='',viz='',btns=[];$('state').textContent='Interactivo';$('bar').style.width='0%';if(current==='sem'){stats=card('Permisos libres',m.permits)+card('En uso',m.active)+card('En espera',m.queue)+card('Capacidad',2);viz=`<div class="memory">${[0,1].map(i=>cell(i<m.active?'🔒':'✓','Recurso '+(i+1),i<m.active?'hot':'')).join('')}</div><div class="sub" style="text-align:center">${m.queue} solicitudes esperando un permiso</div>`;btns=[['Adquirir permiso',()=>action('acquire'),true],['Liberar permiso',()=>action('release')]]}else if(current==='producer'){stats=card('Ocupados',m.buffer.length)+card('Libres',3-m.buffer.length)+card('Capacidad',3)+card('Siguiente elemento',m.serial);viz=`<div class="memory">${[0,1,2].map(i=>cell(m.buffer[i]??'—','Posición '+(i+1),m.buffer[i]?'hot':'')).join('')}</div><div class="sub" style="text-align:center">Productor → [ búfer compartido ] → Consumidor</div>`;btns=[['＋ Producir',()=>action('add'),true],['− Consumir',()=>action('take')]]}else if(current==='condition'){stats=card('Condición',m.ready?'Verdadera':'Falsa')+card('Dato',m.ready?'Disponible':'Vacío')+card('Señal',m.ready?'Enviada':'Pendiente')+card('Consumidor',m.ready?'Puede seguir':'Espera');viz=`<div class="memory">${cell(m.ready?'🔔':'⏳',m.ready?'Dato disponible':'Sin dato',m.ready?'hot':'')}</div><div class="sub" style="text-align:center">Esperar → Productor señala → Comprobar → Consumir</div>`;btns=[['Esperar',()=>action('wait')],['Producir y señalar',()=>action('signal'),true],['Consumir',()=>action('consume')]]}else if(current==='spin'){stats=card('Lock',m.lock?'Ocupado':'Libre')+card('Propietario',m.lock||'Ninguno')+card('Intentos fallidos',m.spins)+card('Espera','Activa');viz=`<div class="memory">${cell(m.lock?'🔒':'🔓',m.lock?'Lo tiene hilo '+m.lock:'Disponible',m.lock?'warn':'hot')}</div><div class="sub" style="text-align:center">Los intentos fallidos representan comprobaciones repetidas; no se mide consumo real de CPU.</div>`;btns=[['Hilo A adquiere',()=>action('a'),true],['Hilo B intenta',()=>action('b')],['Liberar lock',()=>action('release')]]}else if(current==='vector'){stats=card('Elementos',m.vector.length)+card('Capacidad mostrada',6)+card('Intercalación',m.conflict?'Insegura':'Normal')+card('Protección','Ninguna');viz=`<div class="memory">${Array.from({length:6},(_,i)=>cell(m.vector[i]??'—','Índice '+i,m.vector[i]?'hot':'')).join('')}</div><div class="sub" style="text-align:center">La intercalación insegura ilustra el riesgo de escrituras sobre la misma posición; no corrompe un vector real.</div>`;btns=[['Hilo A: push_back',()=>action('a'),true],['Hilo B: pop_back',()=>action('b')],['Simular conflicto',()=>action('conflict')]]}$('stats').innerHTML=stats;$('visual').innerHTML=viz;controls(...btns,['Reiniciar',reset])}
$('nav').innerHTML=tabs.map(([id,icon,name])=>`<button class="nav" data-id="${id}"><span>${icon}</span>${name}</button>`).join('');$('nav').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;current=b.dataset.id;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('sel',x.dataset.id===current));reset()};$('step').onclick=next;$('play').onclick=all;$('reset').onclick=reset;$('clear').onclick=()=>{events=[];$('log').innerHTML=''};document.querySelector('.nav').classList.add('sel');reset();})();
</script></body></html>
